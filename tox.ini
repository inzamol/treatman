[tox]
min_version = 4.0
env_list = py313, stackvet
isolated_build = true

[testenv]
description = Run unit and integration tests with pytest
deps =
    pytest>=8.0.0
    pytest-asyncio>=0.23.0
    stackvet>=0.3.3
commands =
    pytest {posargs:tests}

[testenv:stackvet]
description = Run StackVet health scorecard and strict CI gating
deps =
    stackvet>=0.3.3
commands =
    stackvet check --strict
    stackvet doctor

[testenv:coverage]
description = Run pytest with code coverage report
deps =
    pytest>=8.0.0
    pytest-asyncio>=0.23.0
    pytest-cov>=5.0.0
commands =
    pytest --cov=tm --cov-report=term-missing {posargs:tests}

